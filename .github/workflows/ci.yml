# Every gate runs on both runners. The core contract reads the core's SOURCE, so it gets a sparse,
# pinned checkout of it. Nothing here calls a model: the backend gate uses a fake.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  # The core revision this plugin's contract is verified against. Bump deliberately.
  CORE_REPO: https://github.com/NousResearch/hermes-agent.git
  CORE_SHA: d4d2ab7b5d104166e7e22a02cafd12f1fe456a31

jobs:
  gates:
    name: gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install the gate dependencies
        run: python -m pip install --quiet "fastapi==0.115.*"

      - name: Desktop test dependencies (React and jsdom, pinned to the core desktop app's versions)
        working-directory: tests
        run: npm ci --no-audit --no-fund

      - name: Core sources for the contract (sparse, pinned)
        run: |
          set -euo pipefail
          core="$RUNNER_TEMP/hermes-core"
          git init -q "$core"
          git -C "$core" remote add origin "$CORE_REPO"
          git -C "$core" sparse-checkout init --no-cone
          # MSYS_NO_PATHCONV: Git Bash on Windows would rewrite /agent/ into C:/Program Files/Git/agent/
          MSYS_NO_PATHCONV=1 git -C "$core" sparse-checkout set /tui_gateway/contracts/events.py /agent/auxiliary_client.py \
            /agent/usage_pricing.py /apps/desktop/src/store/notifications.ts /apps/desktop/src/sdk/index.ts /apps/desktop/src/contrib/plugin.ts \
            /tui_gateway/prompt_turn.py /hermes_state.py /hermes_state_messages.py /hermes_state_sessions.py /agent/redact.py \
            /apps/desktop/src/app/chat/composer/contrib.ts /apps/desktop/src/app/chat/composer/index.tsx \
            /apps/desktop/src/contrib/react/slot.tsx /apps/desktop/src/lib/session-row-slots.ts \
            /apps/desktop/src/app/chat/sidebar/session-row-slots.tsx /apps/desktop/src/app/chat/sidebar/session-row.tsx \
            /hermes_state_titles.py /apps/desktop/src/styles.css \
            /hermes_cli/plugins_cmd_install.py /hermes_cli/web_server_dashboard.py /hermes_cli/plugins_cmd_remove.py \
            /apps/desktop/src/api/plugins.ts /apps/desktop/electron/desktop-plugins-root.ts /apps/desktop/src/sdk/runtime.ts \
            /apps/desktop/src/app/capabilities/plugins/plugins-tab.tsx /apps/desktop/src/i18n/en.ts \
            /hermes_cli/plugins.py /hermes_cli/web_routers/models.py /apps/desktop/src/app/settings/aux-task-rows.tsx \
            /agent/tool_result_classification.py \
            /agent/context_compressor.py \
            /agent/turn_context_compaction.py \
            /agent/conversation_compression.py \
            /apps/desktop/src/sdk/composer.ts /apps/desktop/src/app/chat/composer/hooks/use-composer-draft.ts \
            /plugins/plugin_storage.py /website/docs/developer-guide/plugins/index.md \
            /apps/desktop/src/contrib/settings-pages.ts /apps/desktop/src/app/settings/plugin-settings.tsx \
            /apps/desktop/src/contrib/react/boundary.tsx /apps/desktop/src/i18n/plugin-i18n.ts \
            /agent/persisted_turn_receipt.py
          for i in 1 2 3; do git -C "$core" fetch -q --depth 1 origin "$CORE_SHA" && break; sleep $((i*20)); done
          git -C "$core" checkout -q FETCH_HEAD
          test -f "$core/agent/auxiliary_client.py" || { echo "core sources missing"; exit 1; }
          echo "HERMES_CORE=$core" >> "$GITHUB_ENV"
          echo "HERMES_HOME=$RUNNER_TEMP/hermes-home" >> "$GITHUB_ENV"

      - name: Backend (fake model)
        working-directory: tests
        run: python check_api.py

      - name: Desktop half
        working-directory: tests
        run: node render_check.mjs

      - name: Static rules
        working-directory: tests
        run: python audit_static.py

      - name: Core contract and its selftest
        working-directory: tests
        run: python contract_core.py && python contract_core.py --selftest

      - name: Canary run (every lock must be able to fail)
        working-directory: tests
        run: python canary_audit.py

  # The backend RUN on real cores: every stable release from the stated minimum (README) and the pin.
  # The core's own dependencies are installed (Python 3.14, as its pyproject requires); the model is a
  # local fake server, so nothing is sent or paid. Add each new stable release here.
  core-versions:
    name: core ${{ matrix.core.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        core:
          - { name: v0.21.6, sha: 818c13be1dc4fd28987e1e881a9408224afd4535 }
          - { name: v0.21.7, sha: 71d34bad1045610252eda02ee79549436896e784 }
          - { name: v0.22.0, sha: e06df9c2eae6901f4c88f464e0ae6e753c0428b8 }
          - { name: v0.22.1, sha: 297552a9d646119871391d202509822cd86330df }
          - { name: v0.22.2, sha: d923a5eb487a17c0a68801bba9ef0f56c81040a8 }
          - { name: pin, sha: d4d2ab7b5d104166e7e22a02cafd12f1fe456a31 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'

      - name: Core at ${{ matrix.core.name }}
        env:
          SHA: ${{ matrix.core.sha }}
        run: |
          set -euo pipefail
          core="$RUNNER_TEMP/hermes-core"
          git init -q "$core"
          git -C "$core" remote add origin "$CORE_REPO"
          for i in 1 2 3; do git -C "$core" fetch -q --depth 1 origin "$SHA" && break; sleep $((i*20)); done
          git -C "$core" checkout -q FETCH_HEAD
          test "$(git -C "$core" rev-parse HEAD)" = "$SHA"
          echo "CORE=$core" >> "$GITHUB_ENV"

      - name: The core's dependencies
        run: |
          python -m pip install --quiet "uv==0.12.*"
          uv pip install --system --quiet -r "$CORE/pyproject.toml" "fastapi==0.115.*"

      - name: Core contract and its selftest
        working-directory: tests
        run: python contract_core.py --core "$CORE" && python contract_core.py --core "$CORE" --selftest

      - name: Backend on the real core (fake model) and its selftest
        working-directory: tests
        run: python core_smoke.py --core "$CORE" && python core_smoke.py --core "$CORE" --selftest
