name: asterisk
label: Asterisk
version: 4.0.0
description: >-
  Asterisk — after a long reply (3,000+ characters) in a chat you opened, a second model
  (the model you choose for it in Settings → Models) rereads that turn — your message, the
  assistant's tool calls and results, and the reply —
  and, only when there is one, names the one thing the reply did not plainly tell you: an unstated
  tradeoff, a result that may be off, a silent assumption, an understated irreversible step, a
  security risk or a cost, and who decided it. Nothing to flag, nothing shown. Keeps a cost ledger
  without any text.
author: Muhammed Enes Alpler
kind: standalone
